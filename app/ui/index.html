<!doctype html>
<html lang="zh-CN" data-theme="dark" data-mode="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye眼</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
          <rect width="200" height="200" rx="50" fill="currentColor" />
          <path d="M30 77 Q100 169 170 77 Q100 113 30 77 Z" fill="#FFFFFF" />
        </svg>
        <div class="titles">
          <div class="title-row">
            <h1>Eye眼</h1>
            <span id="mode" class="pill">手动</span>
          </div>
          <p class="sub">Gamma 调节 · 逐屏独立</p>
        </div>
      </div>

      <div class="top-right">
        <span id="status" class="status">正在读取…</span>

        <button id="theme" class="icon-btn" title="主题：跟随系统">
          <svg class="ti ti-auto" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor" />
          </svg>
          <svg class="ti ti-light" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <svg class="ti ti-dark" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20 14.6A8.2 8.2 0 0 1 9.4 4a7.6 7.6 0 1 0 10.6 10.6z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button id="power" class="power" title="开关护眼" aria-label="开关护眼">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
            <path
              d="M6.5 6.5a8 8 0 1 0 11 0"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>
      </div>
    </header>

    <div id="hdr-warn" class="warn hidden">
      检测到有屏幕开启了 HDR，那块屏上色温调整不会生效。
    </div>

    <div id="break-banner" class="break-banner hidden">
      <span class="banner-title">该抬头看看远处了</span>
      <span id="bannerCount" class="banner-count">20</span>
      <button id="bannerClose" class="banner-btn">知道了</button>
    </div>

    <div class="body">
      <aside class="side">
        <div class="side-head">
          <span class="side-label">预设</span>
          <button id="restorePresets" class="mini-btn hidden" title="把移出的内置预设找回来">
            恢复默认
          </button>
        </div>
        <div id="presets" class="preset-list"></div>
      </aside>

      <main class="main">
        <div class="main-scroll">
        <section class="hero">
          <div class="hero-head">
            <div class="hero-head-left">
              <span class="label">色温</span>
              <span id="autoNote" class="tag hidden">自动接管中</span>
            </div>
            <span class="big" id="heroValue"><span id="kelvinNum">4500</span><i>K</i></span>
          </div>
          <input id="kelvin" class="range-temp" type="range" min="1000" max="6500" step="50" />
          <div class="scale">
            <span>1000 · 暖</span>
            <span>6500 · 中性</span>
          </div>

          <div class="rows">
            <div class="row">
              <label for="brightness">亮度</label>
              <input id="brightness" class="range-dim" type="range" min="20" max="100" />
              <span id="brightnessVal" class="val">100%</span>
            </div>
            <div class="row split">
              <span class="half">
                <label for="color">颜色</label>
                <input id="color" type="color" value="#c7edcc" />
              </span>
              <span class="half">
                <label for="target">应用到</label>
                <select id="target"></select>
              </span>
            </div>
          </div>
        </section>

        <!-- ------------------------------------------------------- 24 小时曲线 -->
        <section class="panel curve-panel">
          <div class="panel-head">
            <h2>24 小时曲线</h2>
            <div class="head-tools">
              <div class="seg" id="modeSeg">
                <button type="button" data-mode="clock">钟点</button>
                <button type="button" data-mode="sun">日出日落</button>
              </div>
              <label class="switch">
                <input id="auto" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="curve-wrap">
            <svg id="curve" viewBox="0 0 720 100" preserveAspectRatio="xMidYMid meet">
              <g id="curveGrid"></g>
              <path id="curveArea" class="curve-area" d="" />
              <path id="curveLine" class="curve-line" d="" />
              <g id="curveMarks"></g>
              <line id="curveNow" class="curve-now" x1="0" y1="10" x2="0" y2="88" />
              <g id="curveDots"></g>
            </svg>
          </div>

          <div class="curve-foot">
            <div class="seg small" id="daySeg">
              <button type="button" data-day="weekday">工作日</button>
              <button type="button" data-day="weekend">周末</button>
            </div>
            <span id="dayNote" class="muted"></span>
            <label class="hint right">
              过渡
              <input id="transition" class="num small" type="number" min="0" max="180" step="10" />
              分钟
            </label>
          </div>

          <div class="anchor-bar">
            <span class="row-label">选中</span>
            <input id="anchorTime" type="time" />
            <input id="anchorK" class="num" type="number" min="1000" max="6500" step="50" />
            <span class="unit">K</span>
            <span id="anchorHint" class="muted">点曲线上的圆点选中，拖动可改时间和色温</span>
          </div>
        </section>

        <div class="grid2">
          <!-- ------------------------------------------------------- 20-20-20 -->
          <section class="panel">
            <div class="panel-head">
              <h2>20-20-20</h2>
              <label class="switch">
                <input id="breakOn" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>

            <div class="clock">
              <span id="breakTime" class="clock-num">20:00</span>
              <span id="breakCap" class="clock-cap">后提醒休息</span>
            </div>
            <div class="bar"><div id="breakBar" class="bar-fill"></div></div>

            <div class="time-row compact">
              <span class="time-label">间隔</span>
              <input id="workMinutes" class="num" type="number" min="1" max="180" step="1" />
              <span class="unit">分钟</span>
              <button id="skip" class="mini-btn end">跳过这次</button>
            </div>

            <div class="switch-row tight">
              <div class="switch-text">
                <div class="switch-title">休息时调暗</div>
              </div>
              <label class="switch">
                <input id="dimScreen" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>
          </section>

          <!-- ----------------------------------------------------------- 用眼 -->
          <section class="panel">
            <div class="panel-head">
              <h2>用眼</h2>
              <span id="streakPill" class="pill off">未开始</span>
            </div>

            <p class="stats-big">
              <span id="todayHours">0</span><i>小时</i><span id="todayMins">0</span><i>分</i>
            </p>
            <p id="todayMeta" class="muted">今天还没有记录</p>
            <div id="weekBars" class="week-bars"></div>
            <p class="muted week-cap">最近七天</p>
          </section>
        </div>

        </div>

        <footer class="foot">
          <span class="foot-text">关闭窗口会缩回托盘，右键托盘图标可以快速切换</span>
          <span class="foot-label">开机自启</span>
          <label class="switch">
            <input id="autostart" type="checkbox" />
            <span class="slider"></span>
          </label>
        </footer>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
